name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Ready-to-upload site: download the zip from the run page and drop it on tiiny.host.
      - uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-site
          path: dist
