<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finish Runner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one phone-width column holding a mock of the workout tile, controls underneath. */
  :root {
    --bg: #000;
    --tile: #1c1c1e;
    --control: #2c2c2e;
    --fg: #fff;
    --muted: #8e8e93;
    --done: #30d158;
    --hit: #ff453a;
    --trash-bg: #3a1d1c;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 40px;
  }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 20px; }
  .intro { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0; }
  .intro strong { color: var(--fg); font-weight: 600; }
  .plan { color: var(--muted); font-size: 22px; margin: 0; }

  .tile { background: var(--tile); border-radius: 22px; padding: 16px 18px 18px; display: grid; gap: 14px; }
  .head { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .grip { width: 18px; height: 9px; border-block: 2px solid var(--muted); flex: none; }
  .head h2 { margin: 0; font-size: 19px; font-weight: 600; white-space: nowrap; }
  .runner-slot { flex: 1; min-width: 0; display: flex; justify-content: center; }
  .runner-slot finish-runner { width: 80%; height: 48px; color: var(--fg); --finish-runner-hit: var(--hit); --finish-runner-done: var(--done); }
  .summary { margin-left: auto; color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .summary svg { color: var(--done); }
  .tile.closed .head { cursor: pointer; }

  .weight { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .stepper { display: flex; align-items: center; background: var(--control); border-radius: 12px; height: 44px; }
  .stepper button { background: none; border: 0; color: var(--fg); font-size: 22px; width: 44px; height: 44px; cursor: pointer; }
  .stepper span { min-width: 44px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
  .unit { color: var(--muted); font-size: 18px; }

  .sets { display: flex; gap: 12px; flex-wrap: wrap; }
  .set {
    width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--control); color: var(--muted); font: 600 20px var(--font); font-variant-numeric: tabular-nums;
    transition: background-color 0.15s, color 0.15s;
  }
  .set.done { background: var(--done); color: var(--fg); }
  .set.add { background: none; border: 2px solid var(--control); color: var(--fg); font-weight: 400; cursor: default; }

  .row { display: flex; justify-content: space-between; align-items: center; }
  .pill { background: var(--control); color: var(--fg); border: 0; border-radius: 999px; height: 40px; padding-inline: 18px; font: 16px var(--font); }
  .trash { background: var(--trash-bg); color: var(--hit); border: 0; border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .controls button {
    flex: 1 1 140px; height: 46px; border-radius: 14px; border: 1px solid var(--control);
    background: var(--tile); color: var(--fg); font: 600 15px var(--font); cursor: pointer;
  }
  .controls button:disabled { color: var(--muted); cursor: default; }
  .status { margin: 0; color: var(--muted); font-size: 13px; text-align: center; min-height: 1.4em; }
  button:focus-visible { outline: 2px solid var(--done); outline-offset: 2px; }
</style>

<main>
  <p class="intro">
    Tap the circles to log sets. When all three are done he runs for <strong>3 seconds</strong> and the tile closes.
    Tap a done set to change its reps and he gets knocked down, then still makes it in 3 seconds.
  </p>

  <p class="plan">Full body, 5 day</p>

  <article class="tile" id="tile">
    <div class="head" id="head">
      <span class="grip" aria-hidden="true"></span>
      <h2>Hack Squat</h2>
      <div class="runner-slot"><finish-runner id="runner" duration="3000"></finish-runner></div>
      <span class="summary" id="summary" hidden>
        <span id="summary-text"></span>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 9.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>
    <div id="body" style="display: grid; gap: 14px">
      <div class="weight">
        <div class="stepper"><button type="button" aria-label="Less weight">−</button><span>40</span><button type="button" aria-label="More weight">+</button></div>
        <span class="unit">kg</span>
      </div>
      <div class="sets" id="sets"></div>
      <div class="row">
        <button type="button" class="pill">− Set</button>
        <button type="button" class="trash" aria-label="Delete exercise">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </article>

  <div class="controls">
    <button type="button" id="complete">Finish all sets</button>
    <button type="button" id="change" disabled>Change reps</button>
  </div>
  <p class="status" id="status" aria-live="polite">Log all three sets to start the countdown.</p>
</main>

<script type="module" src="./finish-runner.js"></script>
<script>
  const TARGET = 10;
  const CLOSE_DELAY = 1000; // lets him run through the line and cheer before the tile folds

  const runner = document.getElementById("runner");
  const tile = document.getElementById("tile");
  const body = document.getElementById("body");
  const summary = document.getElementById("summary");
  const setsEl = document.getElementById("sets");
  const changeBtn = document.getElementById("change");
  const status = document.getElementById("status");

  /** Reps logged per set, 0 means not done yet. */
  const sets = [0, 0, 0];
  let closeTimer = 0;

  const allDone = () => sets.every(Boolean);

  function render() {
    setsEl.replaceChildren(
      ...sets.map((reps, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = reps ? "set done" : "set";
        b.textContent = String(reps || TARGET);
        b.setAttribute("aria-label", reps ? `Set ${i + 1}: ${reps} reps, tap to lower` : `Log set ${i + 1}`);
        b.addEventListener("click", () => tapSet(i));
        return b;
      }),
      Object.assign(document.createElement("span"), { className: "set add", textContent: "+", ariaHidden: "true", style: "display:grid;place-items:center" }),
    );
    changeBtn.disabled = !allDone();
  }

  /** Mirrors the app: tapping a done set lowers its reps, below 1 it is undone again. */
  function tapSet(i) {
    const wasDone = allDone();
    sets[i] = sets[i] ? sets[i] - 1 : TARGET;
    update(wasDone);
  }

  /** @param {boolean} wasDone */
  function update(wasDone) {
    clearTimeout(closeTimer);
    render();
    if (!allDone()) {
      runner.stop();
      status.textContent = "Log all three sets to start the countdown.";
    } else if (wasDone) {
      runner.reset();
      status.textContent = "Reps changed, countdown restarted.";
    } else {
      runner.start();
      status.textContent = "All sets done, closing in 3 seconds.";
    }
  }

  function setClosed(closed) {
    tile.classList.toggle("closed", closed);
    body.style.display = closed ? "none" : "grid";
    runner.hidden = closed;
    summary.hidden = !closed;
    document.getElementById("summary-text").textContent = `${sets.join(" · ")} reps`;
  }

  runner.addEventListener("finish", () => {
    status.textContent = "Done. Tap the tile to reopen it.";
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => {
      runner.stop();
      setClosed(true);
    }, CLOSE_DELAY);
  });

  document.getElementById("head").addEventListener("click", () => {
    if (!tile.classList.contains("closed")) return;
    setClosed(false);
    status.textContent = "Tap a done set to change its reps and restart the countdown.";
  });

  document.getElementById("complete").addEventListener("click", () => {
    if (tile.classList.contains("closed")) setClosed(false);
    const wasDone = allDone();
    sets.forEach((reps, i) => (sets[i] = reps || TARGET));
    if (!wasDone) update(false);
  });

  changeBtn.addEventListener("click", () => tapSet(sets.findLastIndex(Boolean)));

  render();
</script>
